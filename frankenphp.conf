{
    log default {
        output stdout
        format json {
            time_format "iso8601"
        }
        level INFO
    }
}

:8000 {
    root * /app/public

    log {
        output stdout
        format json {
            time_format "iso8601"
        }
        level INFO
    }

    php_fastcgi frankenphp
    file_server
}
