apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-blog
  labels:
    app: e-blog
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: e-blog
  template:
    metadata:
      labels:
        app: e-blog
    spec:
      containers:
        - name: e-blog
          image: ghcr.io/exa31/e-blog:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: e-blog-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: e-blog-service
  labels:
    app: e-blog
spec:
  type: ClusterIP
  selector:
    app: e-blog
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: e-blog-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - e-blog.eka-dev.cloud
      secretName: e-blog-tls
  rules:
    - host: e-blog.eka-dev.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: e-blog-service
                port:
                  number: 80
