apiVersion: v1
kind: Secret
metadata:
  name: e-blog-env
type: Opaque
stringData:
  APP_NAME: "Laravel"
  APP_ENV: "production"
  APP_KEY: "base64:your_app_key_here"
  APP_DEBUG: "false"
  APP_URL: "https://e-blog.eka-dev.cloud"
  
  DB_CONNECTION: "pgsql"
  DB_HOST: "your_db_host"
  DB_PORT: "5432"
  DB_DATABASE: "filament"
  DB_USERNAME: "your_db_user"
  DB_PASSWORD: "your_db_password"
  
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_SECURE_COOKIE: "true"
  
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "file"
  FILESYSTEM_DISK: "minio"
  
  MINIO_KEY: "minioadmin"
  MINIO_SECRET: "your_minio_secret"
  MINIO_BUCKET: "project"
  MINIO_ROOT: "blog"
  MINIO_ENDPOINT: "https://minio.example.com"
  MINIO_URL: "https://minio.example.com/project"
  MINIO_USE_PATH_STYLE_ENDPOINT: "true"
  
  GOOGLE_CLIENT_ID: "your_google_client_id"
  GOOGLE_CLIENT_SECRET: "your_google_client_secret"
  GOOGLE_REDIRECT_URI: "https://e-blog.eka-dev.cloud/auth/google-callback"
  
  NEWS_API_KEY: "your_news_api_key"
  NEWS_API_CATEGORY: "technology"
  NEWS_API_LANGUAGE: "en"
  
  OCTANE_SERVER: "frankenphp"
